    <text x="62" y="241" font-size="18">Inspect. Align. Resample. Trace.</text>
    <text x="62" y="273" font-size="15">Rust at the core. NumPy at the surface.</text>
    <text x="62" y="298" font-size="15">Explicit clocks, validity and source support.</text>
