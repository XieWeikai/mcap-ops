<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">mcap-ops: time is part of the data</title>
  <desc id="desc">Rust and NumPy operators convert asynchronous position, command and frame streams into aligned steps, keeping validity and source provenance.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4e8"/>
      <stop offset="1" stop-color="#e3eddf"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#214a3d" opacity=".10"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6" fill="none" stroke="#245341" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1280" height="460" rx="20" fill="url(#paper)"/>
  <rect width="1280" height="460" rx="20" fill="url(#grid)"/>
  <circle cx="1176" cy="-16" r="220" fill="#b5d5bd" opacity=".3"/>
  <circle cx="1230" cy="465" r="130" fill="#d7b65d" opacity=".12"/>
